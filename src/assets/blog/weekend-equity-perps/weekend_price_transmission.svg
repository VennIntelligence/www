<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="810" height="670" viewBox="0 0 810 670" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">

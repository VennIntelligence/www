  <line x1="350" y1="548" x2="402" y2="584" stroke="#333333" stroke-width="1.2" marker-end="url(#wtArrow)"/>
  <text x="345" y="574" text-anchor="end" font-size="10.5" font-style="italic" fill="#777777">liquidations &#38; deleveraging</text>


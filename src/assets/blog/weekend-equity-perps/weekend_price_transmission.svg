  <path d="M 592 624 L 748 624 Q 764 624 764 608 L 764 356 Q 764 340 748 340 L 740 340" fill="none" stroke="#888888" stroke-width="1.1" stroke-dasharray="5 4" marker-end="url(#wtArrowGray)"/>

  <line x1="48" y1="592" x2="68" y2="592" stroke="#888888" stroke-width="1.1" stroke-dasharray="5 4"/>

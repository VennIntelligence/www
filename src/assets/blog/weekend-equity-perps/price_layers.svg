<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="700" height="430" viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="plArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="430" fill="white"/>

  <!-- Nodes -->
  <rect x="255" y="16" width="190" height="34" rx="8" fill="none" stroke="#333333" stroke-width="1.2"/>
  <text x="350" y="38" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#222222">Information &#38; order flow</text>

  <rect x="200" y="80" width="300" height="48" rx="8" fill="none" stroke="#333333" stroke-width="1.2"/>
  <text x="350" y="99" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#222222">Order-book prices</text>
  <text x="350" y="117" text-anchor="middle" font-size="11.5" fill="#444444">best bid / best ask / impact price</text>

  <rect x="40" y="178" width="190" height="48" rx="8" fill="none" stroke="#333333" stroke-width="1.2"/>
  <text x="135" y="197" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#222222">Last price</text>
  <text x="135" y="215" text-anchor="middle" font-size="11.5" fill="#444444">most recent actual trade</text>

  <rect x="260" y="178" width="330" height="48" rx="8" fill="none" stroke="#333333" stroke-width="1.2"/>
  <text x="425" y="197" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#222222">Index / Oracle</text>
  <text x="425" y="215" text-anchor="middle" font-size="11.5" fill="#444444">external spot &#183; other venues&#8217; perps &#183; own book</text>

  <rect x="190" y="276" width="330" height="48" rx="8" fill="none" stroke="#333333" stroke-width="1.2"/>
  <text x="355" y="295" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#222222">Mark price</text>
  <text x="355" y="313" text-anchor="middle" font-size="11.5" fill="#444444">risk price: medians, EMA smoothing, basis, clamps</text>

  <rect x="175" y="374" width="360" height="36" rx="8" fill="none" stroke="#333333" stroke-width="1.2"/>
  <text x="355" y="397" text-anchor="middle" font-size="12.5" fill="#222222">margin &#183; liquidation &#183; unrealized PnL &#183; trigger orders</text>

  <!-- Edges -->
  <line x1="350" y1="50" x2="350" y2="76" stroke="#333333" stroke-width="1.2" marker-end="url(#plArrow)"/>

  <line x1="255" y1="128" x2="160" y2="174" stroke="#333333" stroke-width="1.2" marker-end="url(#plArrow)"/>
  <text x="140" y="150" font-size="10.5" font-style="italic" fill="#777777">hit by aggressive orders</text>

  <line x1="380" y1="128" x2="415" y2="174" stroke="#333333" stroke-width="1.2" marker-end="url(#plArrow)"/>
  <text x="420" y="150" font-size="10.5" font-style="italic" fill="#777777">off-hours weight rises</text>

  <line x1="150" y1="226" x2="265" y2="274" stroke="#333333" stroke-width="1.2" marker-end="url(#plArrow)"/>
  <text x="130" y="255" font-size="10.5" font-style="italic" fill="#777777">partial formula input</text>

  <line x1="420" y1="226" x2="390" y2="272" stroke="#333333" stroke-width="1.2" marker-end="url(#plArrow)"/>
  <text x="425" y="252" font-size="10.5" font-style="italic" fill="#777777">core anchor</text>

  <path d="M 500 104 C 630 125, 630 255, 526 288" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#plArrow)"/>
  <text x="598" y="185" font-size="10.5" font-style="italic" fill="#777777">basis / BBO /</text>
  <text x="598" y="199" font-size="10.5" font-style="italic" fill="#777777">impact input</text>

  <line x1="355" y1="324" x2="355" y2="370" stroke="#333333" stroke-width="1.2" marker-end="url(#plArrow)"/>
</svg>

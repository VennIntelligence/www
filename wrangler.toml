name = "www"
main = "worker.js"
compatibility_date = "2026-03-28"

[vars]
STRIPE_FORMAL_CONSULTING_PRICE_ID = "price_1TNwNj3XjhTjA4m7a66dA3lT"
SITE_URL = "https://vennai.org"
STRIPE_SUCCESS_URL = "https://vennai.org/?checkout=success#consultants"
STRIPE_CANCEL_URL = "https://vennai.org/?checkout=cancel#consultants"
# Public Turnstile site key for the /apply form (served via GET /api/grants/config, so no rebuild on change).
# Default: empty until the widget is created in the Cloudflare dashboard; the form shows a config error while empty.
TURNSTILE_SITE_KEY = "0x4AAAAAAFYYd0mgg53M3ES0"
# Client ID of the GitHub OAuth App behind "Sign in with GitHub" on /apply (public, not a secret; no scopes requested).
# Registered callbacks: https://vennai.org/api/grants/github/callback and http://localhost:8787/api/grants/github/callback.
# Sign-in shows "not configured" while this or the GITHUB_CLIENT_SECRET / GRANT_SESSION_SECRET secrets are missing.
GITHUB_CLIENT_ID = "Ov23liwPe05fu14fk2Zg"
# Account gate for grant applicants (worker/github.js). Server-side only: never sent to the browser.
# Minimum public, non-fork repositories the applicant owns (inclusive). Default: "11" (i.e. more than 10).
# Raise to demand a longer public track record; lower to admit newer GitHub users.
GRANT_MIN_REPOS = "11"
# Minimum average stars across those owned repositories (inclusive). Default: "15".
# Raise to require consistently noticed work; lower to tolerate many small / experimental repos.
GRANT_MIN_AVG_STARS = "15"
# Minimum stars on the applicant's own most-starred repository (inclusive). Default: "101" (i.e. more than 100).
# Raise to require a clear hit project; lower for earlier-stage teams.
GRANT_MIN_MAX_STARS = "101"
# TEST-ONLY: "1" lets signed-in applicants see their own GitHub stats (owned repos / avg stars / top repo stars)
# on /apply; thresholds and pass/fail per criterion are never shown. Default for launch: "0" (hide all metrics).
GRANT_SHOW_METRICS = "0"
# Inbox that gets an email for every accepted application (must also be the send_email binding's
# destination below and a verified Email Routing address). Empty = no notifications.
GRANT_NOTIFY_TO = "gaochengzhi1999@gmail.com"

# Grant applications (see worker/grants.js and migrations/).
[[d1_databases]]
binding = "GRANTS_DB"
database_name = "vennai-grants"
database_id = "aefe9d1b-be90-44fe-a001-c63f523fb6aa"
migrations_dir = "migrations"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Browser navigations would otherwise get the SPA shell straight from the asset layer
# (React then renders 404); OAuth redirects and the admin page must reach worker.js.
run_worker_first = ["/api/*", "/admin/*"]

# Per-IP throttle for GET /api/grants/verify and /api/grants/github/me (each call hits GitHub / oEmbed).
# Default: 20 requests per 60 s. Raise if legit users hit 429 while typing; lower to protect the GitHub quota.
[[ratelimits]]
name = "GRANTS_VERIFY_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Email Routing outbound binding for new-application notifications (worker/notify.js).
# Can only deliver to verified destination addresses; keep in sync with GRANT_NOTIFY_TO.
[[send_email]]
name = "GRANT_NOTIFY"
destination_address = "gaochengzhi1999@gmail.com"
